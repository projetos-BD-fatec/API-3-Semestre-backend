# ===== Regras de negocio da guia =====
# Prazo de validade da guia oficial, em MESES, contado a partir do upload
# (emissao). E gravado na guia no momento do upload: mudar aqui vale apenas
# para as guias carregadas DEPOIS da mudanca.
fusex.guia.validade-meses=2
# Quando o job que marca como VENCIDA as guias ATIVAS fora do prazo roda
# (formato cron do Spring: seg min hora dia mes dia-da-semana). Padrao: 00:05.
# Tambem roda uma vez sempre que o backend sobe.
fusex.guia.vencimento-cron=0 5 0 * * *

# ===== Assinatura do beneficiario na guia utilizada =====
# Minutos de validade do codigo de 6 digitos mostrado no app do beneficiario
fusex.assinatura.codigo-validade-minutos=10
# Erros de codigo permitidos antes de bloquear o codigo (OCS pede outro)
fusex.assinatura.max-tentativas=5
# Quantos codigos novos a OCS pode pedir por guia na ultima hora
fusex.assinatura.max-solicitacoes-por-hora=10
# Diagnostico temporario de seguranca
logging.level.org.springframework.security=DEBUG
